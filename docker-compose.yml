version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fiagro
      POSTGRES_USER: fiagro
      POSTGRES_PASSWORD: fiagro123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiagro"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fiagro:fiagro123@db:5432/fiagro
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      SCHEDULER_ENABLED: "true"
      SCHEDULER_HOUR: "7"
      SCHEDULER_MINUTE: "0"
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    command: >
      sh -c "python init_data.py && streamlit run app.py --server.port=8501 --server.address=0.0.0.0"

volumes:
  pgdata:
